<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ZarSeb intake — responses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../rachel-schwartz/styles.css">
  <style>
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 18px; }
    .key-box { flex:1; min-width:200px; }
    .entry { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:16px 18px; margin:0 0 14px; box-shadow:var(--shadow); }
    .entry header { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
    .entry h3 { margin:0; color:var(--navy); }
    .meta { color:var(--slate-muted); font-size:.82rem; }
    .tag { display:inline-block; background:var(--warn-bg); color:var(--navy); font-size:.7rem; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:99px; margin-left:6px; }
    pre { background:var(--page-bg); border:1px solid var(--rule); border-radius:6px; padding:12px; overflow:auto; font-size:.8rem; max-height:360px; }
    .err { color:var(--danger); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="monogram" aria-hidden="true">ZS</div>
      <div class="header-text">
        <h1>ZARSEB ENTERPRISES LLC</h1>
        <p class="title">Intake responses</p>
        <p class="sub">Private view — requires a secret key</p>
      </div>
    </div>
  </header>
  <main class="wrap">
    <p class="help">This page is not linked from the public form. Add the secret key in the box or as <code>?key=</code> in the URL. Do not forward this link.</p>
    <div class="toolbar">
      <label class="field key-box" style="margin:0">
        <span class="field-label">View key</span>
        <input id="key" type="password" autocomplete="off" placeholder="Paste the secret key">
      </label>
      <button class="btn btn-primary" id="load" type="button">Load responses</button>
      <button class="btn btn-ghost" id="export" type="button" hidden>Export all as JSON</button>
    </div>
    <p id="status" class="help" role="status"></p>
    <div id="list"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="results.js"></script>
</body>
</html>
